name: Push Shopify app config

# Sends a store copy's shopify.app.<store>.toml (URLs, scopes, webhooks) and the
# extensions (discount Function, theme block) to Shopify as a new app version.
# Run by hand after changing them. Needs that store copy's App Automation
# Token secret, generated in the Dev Dashboard under the app's
# Settings > App Automation Token.
on:
  workflow_dispatch:
    inputs:
      store:
        description: "Which store's copy: dyesub (Dye Sublimation Store) or giftboxes (giftboxes.co.uk)"
        type: choice
        options: [dyesub, giftboxes]
        default: dyesub
      allow_deletes:
        description: "Allow removing extensions that are no longer in the repo"
        type: boolean
        default: false

jobs:
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g @shopify/cli@latest
      - name: Deploy app version
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ inputs.store == 'giftboxes' && secrets.SHOPIFY_GIFTBOXES_AUTOMATION_TOKEN || secrets.SHOPIFY_DYESUB_AUTOMATION_TOKEN }}
          CONFIG: ${{ inputs.store }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          DELETES: ${{ inputs.allow_deletes && '--allow-deletes' || '' }}
        # On failure, repeat the end of the output as an annotation, which is
        # readable from the run's summary and the API without the raw logs.
        run: |
          set -o pipefail
          if ! shopify app deploy --config "$CONFIG" --allow-updates $DELETES --source-control-url "$COMMIT_URL" 2>&1 | tee deploy.log; then
            msg=$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' deploy.log | grep -v '^[[:space:]]*$' | tail -25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=shopify app deploy failed::$msg"
            exit 1
          fi
