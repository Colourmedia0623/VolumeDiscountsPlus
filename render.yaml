# Render Blueprint: one web service per store, each with its own disk.
# In Render: New > Blueprint, pick this repo. Render asks for the secret
# values marked `sync: false` when it creates the services.
services:
  - type: web
    name: vdp-dyesublimationstore
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: write_discounts,read_products
      - key: PORT
        value: "3000"

  - type: web
    name: vdp-giftboxes
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: write_discounts,read_products
      - key: PORT
        value: "3000"
